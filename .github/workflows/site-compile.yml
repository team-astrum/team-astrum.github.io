name: Compila e pubblica il sito

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Permessi di base per leggere il codice
permissions:
  contents: read

env:
  SITE_DIR: .

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.SITE_DIR }}/package-lock.json

      - name: Installa dipendenze
        working-directory: ${{ env.SITE_DIR }}
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Rimosso VITE_BASE: in questo modo Vite usa il fallback '/' (la radice corretta per i siti <user>.github.io)
      - name: Build del sito
        working-directory: ${{ env.SITE_DIR }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
